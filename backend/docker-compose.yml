version: "3.8"

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-owner/booker-backend}:latest
    container_name: booker-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
